version: '3.8'

services:
  # ClickHouse 数据库
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    ports:
      - "8123:8123"  # HTTP 接口
      - "9000:9000"  # Native 接口
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse-init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - CLICKHOUSE_DB=solana
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
    networks:
      - solana-sync

  # Kafka (使用 Redpanda 作为轻量级替代)
  redpanda:
    image: docker.redpanda.com/vectorized/redpanda:latest
    container_name: redpanda
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --reserve-memory
      - "0M"
      - --overprovisioned
      - --node-id
      - "0"
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"   # Kafka API
      - "9644:9644"   # Admin API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - solana-sync

  # Kafka to ClickHouse Sync Service
  sync-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kafka-clickhouse-sync
    depends_on:
      - clickhouse
      - redpanda
    environment:
      - CONFIG_PATH=/app/config/config.toml
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_DATABASE=solana
      - RUST_LOG=info
    volumes:
      - ./config:/app/config
    networks:
      - solana-sync
    restart: unless-stopped

volumes:
  clickhouse-data:
  redpanda-data:

networks:
  solana-sync:
    driver: bridge
